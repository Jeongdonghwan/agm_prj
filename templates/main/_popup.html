<!-- 메인 팝업 배너 — 어드민 배너 관리(position=popup)에서 등록, 오늘 하루 보지 않기 지원 -->
{% if popup_banner %}
<div class="main-popup-bg" id="main-popup" hidden data-popup-id="{{ popup_banner.id }}">
  <div class="main-popup pp-img-only" role="dialog" aria-modal="true" aria-label="{{ popup_banner.title or '안내' }}">
    {% if popup_banner.link_url %}
    <a href="{{ popup_banner.link_url }}"><img src="{{ popup_banner.image_url }}" alt="{{ popup_banner.title or '' }}"></a>
    {% else %}
    <img src="{{ popup_banner.image_url }}" alt="{{ popup_banner.title or '' }}">
    {% endif %}
    <div class="pp-foot">
      <label><input type="checkbox" id="popup-today"> 오늘 하루 보지 않기</label>
      <button type="button" id="popup-close">닫기</button>
    </div>
  </div>
</div>

<script>
(function () {
  const bg = document.getElementById('main-popup');
  if (!bg) return;
  // 배너별 키 — 새 팝업을 등록하면 이전에 숨겼어도 다시 보인다
  const KEY = 'angimo_popup_hide_until_' + bg.dataset.popupId;
  const hideUntil = localStorage.getItem(KEY);
  if (hideUntil && new Date(hideUntil) > new Date()) return; // 오늘 하루 숨김 중
  bg.hidden = false;

  function close() {
    if (document.getElementById('popup-today').checked) {
      const until = new Date();
      until.setHours(24, 0, 0, 0); // 오늘 자정까지
      localStorage.setItem(KEY, until.toISOString());
    }
    bg.hidden = true;
  }
  document.getElementById('popup-close').addEventListener('click', close);
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !bg.hidden) close(); });
})();
</script>
{% endif %}
