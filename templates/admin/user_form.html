{% extends "admin/base.html" %}
{% set admin_active = 'users' %}
{% block title %}새 회원 추가 - {{ site_name }}{% endblock %}
{% block topbar_title %}새 회원 추가{% endblock %}

{% block content %}
<form method="post" class="panel" style="margin-top:0;max-width:620px">
  <div class="pf-body">
    <div class="pf-row">
      <div class="pf-field"><label>이메일 *</label>
        <input type="email" name="email" required value="{{ form.get('email', '') }}"></div>
      <div class="pf-field"><label>비밀번호 * <small>(8자 이상)</small></label>
        <input type="text" name="password" required minlength="8" placeholder="회원에게 전달할 초기 비밀번호"></div>
    </div>
    <div class="pf-row">
      <div class="pf-field"><label>이름</label>
        <input type="text" name="name" value="{{ form.get('name', '') }}"></div>
      <div class="pf-field"><label>닉네임</label>
        <input type="text" name="nickname" value="{{ form.get('nickname', '') }}" placeholder="커뮤니티 표시명 (선택)"></div>
    </div>
    <div class="pf-row">
      <div class="pf-field"><label>휴대폰</label>
        <input type="tel" name="phone" value="{{ form.get('phone', '') }}" placeholder="010-0000-0000"></div>
      <div class="pf-field"><label>커뮤니티 이용</label>
        <select name="approve_now">
          <option value="1" selected>즉시 승인 (접견예약확인 생략)</option>
          <option value="0">미승인 (본인이 인증 제출)</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn pri" type="submit" style="padding:12px 24px">회원 추가</button>
      <a class="btn line" href="{{ url_for('admin.users') }}">취소</a>
    </div>
  </div>
</form>
{% endblock %}
