<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="서로 손을 맞잡은 커뮤니티 일러스트">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3EA"/>
      <stop offset="1" stop-color="#F6DCC9"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE7D8"/>
      <stop offset="1" stop-color="#EFCDB4"/>
    </linearGradient>
    <linearGradient id="sleeveL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B5CFF"/>
      <stop offset="1" stop-color="#0A2A5E"/>
    </linearGradient>
    <linearGradient id="sleeveR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C86FF"/>
      <stop offset="1" stop-color="#0F47C2"/>
    </linearGradient>
  </defs>

  <!-- 배경 원 -->
  <circle cx="122" cy="98" r="76" fill="#EAF1FF"/>
  <circle cx="122" cy="98" r="58" fill="#F7FAFF"/>

  <!-- 장식: 잎사귀 (좌하단) -->
  <g fill="#1B5CFF" opacity=".55">
    <path d="M40 150c14-3 24-11 28-24-15-1-26 6-28 24Z"/>
    <path d="M46 168c13-6 20-16 20-29-14 3-23 12-20 29Z"/>
  </g>
  <!-- 장식: 잎사귀 (우하단) -->
  <g fill="#0F47C2" opacity=".45">
    <path d="M204 150c-14-3-24-11-28-24 15-1 26 6 28 24Z"/>
    <path d="M198 168c-13-6-20-16-20-29 14 3 23 12 20 29Z"/>
  </g>

  <!-- 장식: 하트 -->
  <path d="M52 44c-5-6-14-5-17 2-3 6 1 12 6 16l11 9 11-9c5-4 9-10 6-16-3-7-12-8-17-2Z" fill="#1B5CFF" opacity=".85"/>
  <path d="M196 62c-3-4-9-3-11 1-2 4 1 8 4 10l7 6 7-6c3-2 6-6 4-10-2-4-8-5-11-1Z" fill="#8FB3FF" opacity=".9"/>

  <!-- 왼쪽 소매 -->
  <path d="M18 172c8-16 20-31 34-44l26 24c-12 11-22 24-28 38-12 2-24-4-32-18Z" fill="url(#sleeveL)"/>
  <!-- 오른쪽 소매 -->
  <path d="M226 172c-8-16-20-31-34-44l-26 24c12 11 22 24 28 38 12 2 24-4 32-18Z" fill="url(#sleeveR)"/>

  <!-- 왼쪽 팔뚝(피부) -->
  <path d="M52 128c9-9 19-17 30-23l22 26c-9 6-18 13-25 21l-27-24Z" fill="url(#skin)"/>
  <!-- 오른쪽 팔뚝(피부) -->
  <path d="M192 128c-9-9-19-17-30-23l-22 26c9 6 18 13 25 21l27-24Z" fill="url(#skin2)"/>

  <!-- 맞잡은 손: 아래쪽 손(왼손) -->
  <path d="M86 104c-6-6-4-15 4-18l30-11c6-2 12 0 15 5l16 26c4 7 1 15-6 18l-26 12c-7 3-15 0-18-7l-15-25Z" fill="url(#skin)"/>
  <!-- 맞잡은 손: 위쪽 손(오른손) — 감싸는 형태 -->
  <path d="M158 96c7-4 15-1 18 6 3 7 0 15-7 18l-28 13c-8 4-17 1-21-6l-8-14 46-17Z" fill="url(#skin2)"/>
  <!-- 손가락 라인 -->
  <g stroke="#E0BFA5" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M112 92 128 118"/>
    <path d="M126 86 142 112"/>
    <path d="M140 81 154 104"/>
  </g>
  <!-- 엄지 -->
  <path d="M104 86c5-4 12-3 15 2l6 10-16 8-9-13c-2-3-1-6 4-7Z" fill="url(#skin2)"/>

  <!-- 하이라이트 -->
  <ellipse cx="118" cy="103" rx="20" ry="8" fill="#fff" opacity=".28" transform="rotate(-24 118 103)"/>
</svg>
